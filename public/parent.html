<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ติดตามผลการเรียน - Tutor Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
    .hero {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 35px 20px 65px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }
    .container { max-width: 760px; margin: -40px auto 0; padding: 0 16px; }
    .card {
      background: var(--surface);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .select-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      background: #fff;
      color: var(--text);
      margin-top: 8px;
    }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      margin: 12px 0 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #10b981, #059669);
      height: 100%;
      transition: width 0.5s ease;
    }
    .topic-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .topic-item:last-child { border-bottom: none; }
    .badge-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .badge-completed { background: #dcfce7; color: #15803d; }
    .badge-in-progress { background: #fef3c7; color: #b45309; }
    .badge-pending { background: #f1f5f9; color: #64748b; }

    .status-tag {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .status-tag.completed { background: #dcfce7; color: #166534; }
    .status-tag.in-progress { background: #fef3c7; color: #92400e; }
    .status-tag.pending { background: #f1f5f9; color: #64748b; }

    .attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      text-decoration: none;
      color: #334155;
      margin: 6px 4px 0 0;
      transition: 0.2s;
    }
    .attachment-pill:hover { background: #e2e8f0; }

    /* Chat / Comment */
    .chat-box {
      max-height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      padding-right: 6px;
    }
    .chat-msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .chat-msg.tutor {
      align-self: flex-start;
      background: #f1f5f9;
      border-bottom-left-radius: 4px;
    }
    .chat-msg.parent {
      align-self: flex-end;
      background: #e0e7ff;
      color: #312e81;
      border-bottom-right-radius: 4px;
    }
    .chat-author {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: var(--primary-dark);
    }
    .chat-input-area {
      display: flex;
      gap: 8px;
    }
    .chat-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.9rem;
    }
    .chat-btn {
      padding: 10px 20px;
      background: var(--primary-dark);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h2 style="font-size: 1.5rem; margin-bottom: 4px;">📊 รายงานความคืบหน้าการเรียน</h2>
    <p style="opacity: 0.9; font-size: 0.9rem;">ดูบันทึกการสอน และสนทนาสอบถามกับคุณครู</p>
  </div>

  <div class="container">
    
    <!-- เลือกรักเรียน -->
    <div class="card">
      <label style="font-weight: 600; font-size: 0.95rem; color: var(--text-muted);">👤 เลือกรายชื่อนักเรียนที่ต้องการดูผลการเรียน:</label>
      <select id="studentSelect" class="select-box" onchange="onStudentChange(this.value)">
        <option value="">กำลังโหลดรายชื่อนักเรียน...</option>
      </select>
    </div>

    <!-- ข้อมูลนักเรียนและความคืบหน้า -->
    <div id="studentDetailCard" class="card" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <h2 id="stName" style="font-size: 1.3rem; color: var(--primary-dark);">น้อง...</h2>
          <p id="stInfo" style="font-size: 0.88rem; color: var(--text-muted); margin-top: 2px;">วิชา: -</p>
        </div>
        <span id="progressPercent" style="font-weight: 700; color: #059669; font-size: 1.2rem;">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <p id="progressCount" style="font-size: 0.8rem; color: var(--text-muted); text-align: right;">ผ่านแล้ว 0 จาก 0 บท</p>
    </div>

    <!-- รายการบทเรียน -->
    <div id="topicCard" class="card" style="display: none;">
      <h3 style="font-size: 1.1rem; margin-bottom: 12px; font-weight: 600;">📑 รายการบทเรียนที่วางแผนไว้</h3>
      <div id="topicList"></div>
    </div>

    <!-- กล่องพูดคุย / ฟีดแบ็กสอบถามหลังเลิกเรียน -->
    <div id="commentCard" class="card" style="display: none;">
      <h3 style="font-size: 1.1rem; margin-bottom: 12px; font-weight: 600;">💬 กล่องข้อความและฟีดแบ็ก (ผู้ปกครอง & คุณครู)</h3>
      <div id="chatBox" class="chat-box">
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">ยังไม่มีข้อความสนทนา</p>
      </div>
      <div class="chat-input-area">
        <input type="text" id="commentInput" class="chat-input" placeholder="พิมพ์ข้อความหรือคำถามถึงคุณครู..." onkeypress="if(event.key==='Enter') sendComment()">
        <button class="chat-btn" onclick="sendComment()">ส่ง</button>
      </div>
    </div>

  </div>

  <script>
    let currentStudentId = null;
    let allStudents = [];

    async function init() {
      try {
        const res = await fetch('/api/parent/students');
        const data = await res.json();
        if (data.success) {
          allStudents = data.students;
          const select = document.getElementById('studentSelect');
          select.innerHTML = '<option value="">-- กรุณาเลือกนักเรียน --</option>';
          allStudents.forEach(st => {
            select.innerHTML += `<option value="${st.parent_access_code}">น้อง${st.nickname} (${st.full_name}) - ${st.grade_level}</option>`;
          });

          const urlParams = new URLSearchParams(window.location.search);
          const code = urlParams.get('code');
          if (code) {
            select.value = code;
            loadStudentData(code);
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    function onStudentChange(code) {
      if (!code) {
        document.getElementById('studentDetailCard').style.display = 'none';
        document.getElementById('topicCard').style.display = 'none';
        document.getElementById('commentCard').style.display = 'none';
        return;
      }
      window.history.pushState({}, '', `?code=${code}`);
      loadStudentData(code);
    }

    async function loadStudentData(code) {
      try {
        const res = await fetch(`/api/parent/view/${code}`);
        const data = await res.json();
        if (data.success) {
          const st = data.student;
          currentStudentId = st.id;

          document.getElementById('stName').innerText = `น้อง${st.nickname} (${st.full_name})`;
          document.getElementById('stInfo').innerText = `ระดับชั้น: ${st.grade_level} | วิชา: ${st.course_title || 'วิชาเรียนทั่วไป'}`;

          const topics = data.topics || [];
          const completedCount = topics.filter(t => t.status === 'completed').length;
          const percent = topics.length > 0 ? Math.round((completedCount / topics.length) * 100) : 0;

          document.getElementById('progressPercent').innerText = `${percent}%`;
          document.getElementById('progressBarFill').style.width = `${percent}%`;
          document.getElementById('progressCount').innerText = `ผ่านแล้ว ${completedCount} จาก ${topics.length} บท`;

          const list = document.getElementById('topicList');
          if (topics.length === 0) {
            list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">ยังไม่มีบทเรียนในขณะนี้</p>';
          } else {
            list.innerHTML = topics.map(t => {
              let badgeClass = t.status === 'completed' ? 'badge-completed' : (t.status === 'in_progress' ? 'badge-in-progress' : 'badge-pending');
              let statusText = t.status === 'completed' ? 'เรียนเสร็จแล้ว' : (t.status === 'in_progress' ? 'กำลังเรียน' : 'ยังไม่เริ่ม');
              let tagClass = t.status === 'completed' ? 'completed' : (t.status === 'in_progress' ? 'in-progress' : 'pending');

              let filesHtml = '';
              if (t.attachments && t.attachments.length > 0) {
                filesHtml = `<div style="margin-top: 8px;">` + t.attachments.map(f => `
                  <a href="${f.url}" target="_blank" class="attachment-pill">📎 ${f.name}</a>
                `).join('') + `</div>`;
              }

              let notesHtml = t.tutor_notes ? `<p style="font-size: 0.88rem; color: #475569; margin-top: 6px; background: #f8fafc; padding: 8px 12px; border-radius: 8px;">📝 <b>บันทึกคุณครู:</b> ${t.tutor_notes}</p>` : '';

              return `
                <div class="topic-item">
                  <div class="badge-num ${badgeClass}">${t.sequence_order}</div>
                  <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                      <b style="font-size: 0.95rem;">${t.title}</b>
                      <span class="status-tag ${tagClass}">${statusText}</span>
                    </div>
                    ${notesHtml}
                    ${filesHtml}
                  </div>
                </div>
              `;
            }).join('');
          }

          document.getElementById('studentDetailCard').style.display = 'block';
          document.getElementById('topicCard').style.display = 'block';
          document.getElementById('commentCard').style.display = 'block';

          loadComments();
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadComments() {
      if (!currentStudentId) return;
      try {
        const res = await fetch(`/api/comments/${currentStudentId}`);
        const data = await res.json();
        const box = document.getElementById('chatBox');
        if (data.success && data.comments.length > 0) {
          box.innerHTML = data.comments.map(c => `
            <div class="chat-msg ${c.sender_role}">
              <div class="chat-author">${c.sender_name} (${c.sender_role === 'tutor' ? 'คุณครู' : 'ผู้ปกครอง'})</div>
              <div>${c.message}</div>
              <div style="font-size: 0.68rem; opacity: 0.6; text-align: right; margin-top: 3px;">
                ${new Date(c.created_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}
              </div>
            </div>
          `).join('');
          box.scrollTop = box.scrollHeight;
        } else {
          box.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 0.85rem;">ยังไม่มีข้อความสนทนา พิมพ์ทักทายคุณครูได้เลยครับ</p>';
        }
      } catch (e) { console.error(e); }
    }

    async function sendComment() {
      const input = document.getElementById('commentInput');
      const msg = input.value.trim();
      if (!msg || !currentStudentId) return;

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            studentId: currentStudentId,
            senderRole: 'parent',
            senderName: 'ผู้ปกครอง',
            message: msg
          })
        });
        const data = await res.json();
        if (data.success) {
          input.value = '';
          loadComments();
        }
      } catch (e) { alert('ส่งข้อความไม่สำเร็จ'); }
    }

    setInterval(() => {
      if (currentStudentId) loadComments();
    }, 8000);

    init();
  </script>
</body>
</html>
