<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานผลการเรียนสำหรับผู้ปกครอง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-16">

  <div class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 shadow-md">
    <div class="max-w-2xl mx-auto">
      <div class="inline-block bg-white/20 text-xs px-3 py-1 rounded-full mb-2">📊 รายงานความคืบหน้าการเรียน</div>
      <h1 class="text-2xl font-bold" id="student-name">กำลังโหลดข้อมูล...</h1>
      <p class="text-indigo-100 text-sm mt-1" id="student-detail"></p>

      <!-- แถบ Progress Bar สรุป % การเรียน -->
      <div class="mt-5 bg-black/20 p-4 rounded-2xl backdrop-blur-sm">
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span>ความคืบหน้าหลักสูตร</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="w-full bg-white/30 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-500"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="max-w-2xl mx-auto px-4 mt-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 font-bold text-slate-800 text-base flex justify-between items-center">
        <span>รายการบทเรียนที่วางแผนไว้</span>
        <span id="topic-count" class="text-xs text-slate-500"></span>
      </div>
      <div id="parent-topics" class="divide-y divide-slate-100">
        <!-- รายการบทเรียนจะถูกแสดงตรงนี้ -->
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    async function loadData() {
      if (!code) {
        document.body.innerHTML = '<div class="p-8 text-center text-red-500">ไม่พบรหัสติดตาม กรุณาตรวจสอบลิงก์อีกครั้ง</div>';
        return;
      }

      const res = await fetch(`/api/parent/view/${code}`);
      const data = await res.json();

      if (!data.success) {
        document.body.innerHTML = `<div class="p-8 text-center text-red-500">${data.error}</div>`;
        return;
      }

      const { student, topics } = data;
      document.getElementById('student-name').innerText = `น้อง${student.nickname || ''} (${student.full_name})`;
      document.getElementById('student-detail').innerText = `ระดับชั้น: ${student.grade_level || 'ไม่ระบุ'} • รหัส: ${student.parent_access_code}`;

      const completedCount = topics.filter(t => t.status === 'completed').length;
      const percent = topics.length > 0 ? Math.round((completedCount / topics.length) * 100) : 0;

      document.getElementById('progress-percent').innerText = `${percent}% (${completedCount}/${topics.length} บท)`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('topic-count').innerText = `ผ่านแล้ว ${completedCount} จาก ${topics.length} บท`;

      const list = document.getElementById('parent-topics');
      if (topics.length === 0) {
        list.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">ยังไม่มีรายการบทเรียน</div>';
        return;
      }

      list.innerHTML = topics.map(t => {
        const isDone = t.status === 'completed';
        const isProg = t.status === 'in_progress';

        return `
          <div class="p-4 flex items-start gap-3">
            <div class="mt-0.5 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${isDone ? 'bg-emerald-500 text-white' : isProg ? 'bg-amber-400 text-white' : 'bg-slate-200 text-slate-600'}">
              ${isDone ? '✓' : t.sequence_order}
            </div>
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <h4 class="font-medium text-slate-800 text-sm">${t.title}</h4>
                <span class="text-xs px-2 py-0.5 rounded-md ${isDone ? 'bg-emerald-50 text-emerald-700' : isProg ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-500'}">
                  ${isDone ? 'เรียนแล้ว' : isProg ? 'กำลังเรียน' : 'ยังไม่เริ่ม'}
                </span>
              </div>

              ${t.completed_at ? `<p class="text-[11px] text-slate-400 mt-0.5">เรียนเสร็จเมื่อ: ${new Date(t.completed_at).toLocaleDateString('th-TH')}</p>` : ''}
              
              ${t.tutor_notes ? `<div class="mt-2 text-xs bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-slate-700">💬 <b>บันทึกจากติวเตอร์:</b> ${t.tutor_notes}</div>` : ''}

              ${t.attachments && t.attachments.length > 0 ? `
                <div class="flex flex-wrap gap-2 mt-2">
                  ${t.attachments.map(a => `
                    <a href="${a.url}" target="_blank" class="inline-flex items-center gap-1 text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg border border-indigo-100 hover:bg-indigo-100">
                      📷 ดูรูปภาพ/เอกสาร (${a.name || 'ไฟล์แนบ'})
                    </a>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
