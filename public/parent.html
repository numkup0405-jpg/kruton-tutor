<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kruton Tutor - สำหรับผู้ปกครอง</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb; --primary-light: #eff6ff; --secondary: #4f46e5;
      --bg-color: #f8fafc; --surface: #ffffff; --text: #1e293b;
      --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background: var(--bg-color); color: var(--text); min-height: 100vh; }
    .wrapper { max-width: 800px; margin: 0 auto; padding: 24px 20px 60px; }

    .top-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .top-header img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .top-header h1 { font-size: 1.2rem; color: var(--primary); font-weight: 700; }
    .top-header span { font-size: 0.8rem; color: var(--text-muted); display: block; }

    .card { background: var(--surface); border-radius: 16px; padding: 22px; margin-bottom: 20px; border: 1px solid var(--border); }
    .select-st { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 1rem; background: white; }
    label.field-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 8px; }

    .profile-header { display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .profile-avatar { width: 54px; height: 54px; background: var(--primary-light); color: var(--primary); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; flex-shrink: 0; }
    .tag { background: #f1f5f9; color: #475569; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; margin-right: 6px; display: inline-block; margin-top: 4px; }

    .topic-folder { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .topic-folder-header { display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; background:#f8fafc; }
    .session-item { padding: 12px 16px; border-top: 1px dashed var(--border); }
    .status-pill { padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .status-pill.completed { background: #dcfce7; color: #166534; }
    .status-pill.in_progress { background: #fef08a; color: #854d0e; }
    .status-pill.pending { background: #f1f5f9; color: #64748b; }

    .chat-box { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; max-width: 80%; }
    .chat-msg.tutor { align-self: flex-start; background: #f1f5f9; border: 1px solid var(--border); }
    .chat-msg.parent { align-self: flex-end; background: var(--primary); color: white; }
    .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: white; }
    .empty-state { text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-header">
      <img src="/logo.png" alt="Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/44';">
      <div>
        <h1>Kruton Tutor</h1>
        <span>หน้าติดตามความคืบหน้าสำหรับผู้ปกครอง</span>
      </div>
    </div>

    <div class="card">
      <label class="field-label">เลือกชื่อนักเรียนที่ต้องการดูผลการเรียน</label>
      <select id="studentSelect" class="select-st" onchange="onSelectStudent(this.value)">
        <option value="">-- กรุณาเลือกนักเรียน --</option>
      </select>
    </div>

    <div id="studentDetailBox"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    // ใช้ config เดียวกับหน้าแดชบอร์ดของติวเตอร์ (โปรเจกต์ Firebase เดียวกัน)
    const firebaseConfig = {
      apiKey: "AIzaSyCFatAoxaWxXzTCunzpx_9Etuv9OL1Ei14",
      authDomain: "kruton-tutor.firebaseapp.com",
      projectId: "kruton-tutor",
      storageBucket: "kruton-tutor.firebasestorage.app",
      messagingSenderId: "426629568710",
      appId: "1:426629568710:web:e4b584205077902429fc7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];
    let currentStudentId = null;
    let unsubTopics = null, unsubSessions = null, unsubComments = null;
    let currentTopics = [], currentSessions = [];

    // โหลดรายชื่อนักเรียนทั้งหมดมาใส่ dropdown (ไม่ใช้ orderBy บน server เพื่อตัดปัญหาเรื่อง index ออกไป เรียงฝั่ง client แทน)
    console.log('[parent.html] เริ่มเชื่อมต่อ Firestore...');
    db.collection('students').onSnapshot(snapshot => {
      console.log('[parent.html] ได้รับข้อมูลนักเรียนจำนวน:', snapshot.size, 'คน');
      allStudents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      allStudents.sort((a, b) => (a.nickname || '').localeCompare(b.nickname || '', 'th'));
      const select = document.getElementById('studentSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">-- กรุณาเลือกนักเรียน --</option>' +
        allStudents.map(s => `<option value="${s.id}">น้อง${s.nickname || '?'} (${s.full_name || '-'}) - ชั้น ${s.grade_level || '-'}</option>`).join('');
      if (currentVal) select.value = currentVal;
    }, err => {
      console.error('[parent.html] โหลดรายชื่อนักเรียนล้มเหลว:', err);
      document.getElementById('studentDetailBox').innerHTML = '<div class="card empty-state">เชื่อมต่อฐานข้อมูลล้มเหลว: ' + err.message + '</div>';
    });

    function onSelectStudent(id) {
      if (unsubTopics) unsubTopics();
      if (unsubSessions) unsubSessions();
      if (unsubComments) unsubComments();
      currentStudentId = id;
      if (!id) {
        document.getElementById('studentDetailBox').innerHTML = '';
        return;
      }
      renderStudentShell();
      loadProgress();
      loadChat();
    }

    function renderStudentShell() {
      const st = allStudents.find(s => s.id === currentStudentId);
      if (!st) return;
      document.getElementById('studentDetailBox').innerHTML = `
        <div class="card">
          <div class="profile-header">
            <div class="profile-avatar">${st.nickname ? st.nickname.charAt(0) : '?'}</div>
            <div>
              <div style="font-size:1.2rem; font-weight:700; color:var(--primary);">${st.full_name} (น้อง${st.nickname})</div>
              <div>
                <span class="tag">📚 คอร์ส: ${st.course_title || '-'}</span>
                <span class="tag">🎓 ชั้น: ${st.grade_level || '-'}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 style="font-size:1.05rem; color:var(--primary); margin-bottom:14px;">📍 แผนการเรียนรู้ &amp; ความคืบหน้า</h3>
          <div id="parentTopicList"></div>
        </div>
        <div class="card">
          <h3 style="font-size:1.05rem; color:var(--primary); margin-bottom:14px;">💬 พูดคุยกับคุณครู</h3>
          <div id="parentChatBox" class="chat-box"></div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="parentMsgInput" class="select-st" placeholder="พิมพ์ข้อความถึงคุณครู..." onkeypress="if(event.key==='Enter') sendParentComment()">
            <button class="btn btn-primary" onclick="sendParentComment()">ส่ง</button>
          </div>
        </div>
      `;
    }

    function loadProgress() {
      unsubTopics = db.collection('topics').where('student_id', '==', currentStudentId).onSnapshot(snapshot => {
        currentTopics = snapshot.docs.map(d => ({ topic_id: d.id, ...d.data() }));
        currentTopics.sort((a, b) => (a.sequence_order || 0) - (b.sequence_order || 0));
        renderParentTopics();
      });
      unsubSessions = db.collection('topicSessions').where('student_id', '==', currentStudentId).onSnapshot(snapshot => {
        currentSessions = snapshot.docs.map(d => ({ session_id: d.id, ...d.data() }));
        currentSessions.sort((a, b) => (a.sequence_order || 0) - (b.sequence_order || 0));
        renderParentTopics();
      });
    }

    function statusLabel(status) {
      if (status === 'completed') return 'ผ่านเกณฑ์';
      if (status === 'in_progress') return 'กำลังเรียน';
      return 'รอดำเนินการ';
    }

    function renderParentTopics() {
      const box = document.getElementById('parentTopicList');
      if (!box) return;
      if (currentTopics.length === 0) {
        box.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูลแผนการเรียน</div>';
        return;
      }
      box.innerHTML = currentTopics.map(t => {
        const sessions = currentSessions.filter(s => s.topic_id === t.topic_id);
        const doneCount = sessions.filter(s => s.status === 'completed').length;
        const sessionsHtml = sessions.map(s => {
          const status = s.status || 'pending';
          const filesHtml = (s.attachments && s.attachments.length > 0)
            ? '<div style="margin-top:8px;">' + s.attachments.map(a => `<a href="${a.file_url}" target="_blank" style="font-size:0.78rem; padding:4px 10px; background:#eff6ff; color:var(--primary); border-radius:6px; text-decoration:none; margin-right:6px; display:inline-block; margin-top:4px;">${a.file_type === 'pdf' ? '📄' : '🖼️'} ${a.file_name}</a>`).join('') + '</div>'
            : '';
          const noteHtml = s.tutor_notes ? `<div style="font-size:0.85rem; color:#334155; margin-top:8px; background:#f8fafc; padding:10px; border-radius:8px;"><b>บันทึกจากคุณครู:</b> ${s.tutor_notes}</div>` : '';
          return `
            <div class="session-item">
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                <b style="font-size:0.92rem;">${s.title}</b>
                <span class="status-pill ${status}">${statusLabel(status)}</span>
              </div>
              ${noteHtml}${filesHtml}
            </div>`;
        }).join('') || '<div class="session-item" style="color:var(--text-muted); font-size:0.85rem;">ยังไม่มีบทเรียนย่อยในหัวข้อนี้</div>';

        return `
          <div class="topic-folder">
            <div class="topic-folder-header">
              <b>📁 ${t.title}</b>
              <span class="tag" style="margin:0;">${doneCount}/${sessions.length} บทเรียน</span>
            </div>
            ${sessionsHtml}
          </div>`;
      }).join('');
    }

    function loadChat() {
      unsubComments = db.collection('comments').where('student_id', '==', currentStudentId).onSnapshot(snapshot => {
        const comments = snapshot.docs.map(d => d.data());
        comments.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderChat(comments);
      });
    }

    function renderChat(comments) {
      const box = document.getElementById('parentChatBox');
      if (!box) return;
      if (comments.length === 0) {
        box.innerHTML = '<div class="empty-state" style="padding:12px 0;">ยังไม่มีข้อความ</div>';
        return;
      }
      box.innerHTML = comments.map(c => `
        <div class="chat-msg ${c.sender_role === 'tutor' ? 'tutor' : 'parent'}">
          <div style="font-size:0.72rem; font-weight:600; margin-bottom:2px; opacity:0.8;">${c.sender_name}</div>
          <div>${c.message}</div>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendParentComment() {
      const input = document.getElementById('parentMsgInput');
      const msg = input.value.trim();
      if (!msg || !currentStudentId) return;
      await db.collection('comments').add({
        student_id: currentStudentId,
        sender_role: 'parent',
        sender_name: 'ผู้ปกครอง',
        message: msg,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      input.value = '';
    }
  </script>
</body>
</html>
