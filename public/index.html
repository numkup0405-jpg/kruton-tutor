<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Portal (ระบบติดตามรายบุคคล)</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
    
    .header {
      background: var(--primary-dark);
      color: white;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }
    .container { max-width: 900px; margin: 28px auto; padding: 0 16px; }
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px -2px rgba(0,0,0,0.04);
    }

    .btn {
      padding: 8px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .btn-primary { background: var(--primary-dark); color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-outline { background: white; border: 1px solid #cbd5e1; color: var(--text); }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .select-st {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }

    /* สไตล์ลิสต์บทเรียนแบบดั้งเดิม */
    .topic-card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid #f1f5f9;
      gap: 16px;
    }
    .topic-card-item:last-child { border-bottom: none; }

    .topic-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
    }
    .badge-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .num-completed { background: #dcfce7; color: #15803d; }
    .num-in_progress { background: #fef08a; color: #854d0e; }
    .num-pending { background: #f1f5f9; color: #64748b; }

    .status-tag {
      font-size: 0.82rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      display: inline-block;
      margin-left: 8px;
    }
    .tag-completed { background: #dcfce7; color: #166534; }
    .tag-in_progress { background: #fef3c7; color: #92400e; }
    .tag-pending { background: #f1f5f9; color: #64748b; }

    .action-link {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      margin-left: 8px;
      color: #64748b;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .action-link:hover { color: var(--primary-dark); }
    .action-link.delete:hover { color: var(--danger); }

    .attachment-capsule {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      text-decoration: none;
      color: #334155;
      margin: 6px 6px 0 0;
      transition: 0.2s;
    }
    .attachment-capsule:hover { background: #e2e8f0; }

    /* กล่องสนทนา */
    .chat-box { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; padding-right: 6px; }
    .chat-msg { padding: 10px 14px; border-radius: 14px; font-size: 0.88rem; max-width: 80%; }
    .chat-msg.tutor { align-self: flex-end; background: #e0e7ff; color: #312e81; }
    .chat-msg.parent { align-self: flex-start; background: #f1f5f9; color: #1e293b; }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="font-size: 1.25rem; font-weight: 600;">📝 Tutor Portal (ระบบติดตามรายบุคคล)</h2>
    <div>
      <a href="/parent.html" target="_blank" style="color: white; margin-right: 16px; text-decoration: underline; font-size: 0.9rem;">🔗 ลิงก์รวมผู้ปกครอง</a>
      <button class="btn" style="background: white; color: var(--primary-dark);" onclick="openAddStudent()">+ เพิ่มนักเรียนใหม่</button>
    </div>
  </div>

  <div class="container">
    
    <!-- กล่องเลือกนักเรียน -->
    <div class="card">
      <label style="font-weight: 600; color: var(--text-muted); font-size: 0.88rem;">เลือกนักเรียนที่ต้องการจัดการ:</label>
      <div style="display: flex; gap: 10px; margin-top: 8px; align-items: center;">
        <select id="studentSelect" class="select-st" onchange="onStudentChange(this.value)">
          <option value="">กำลังโหลดรายชื่อนักเรียน...</option>
        </select>
        <button class="btn btn-outline" onclick="editCurrentStudent()" title="แก้ไขข้อมูลนักเรียน">✏️</button>
        <button class="btn btn-danger" onclick="deleteCurrentStudent()" title="ลบนักเรียน">🗑️</button>
        <button class="btn btn-primary" onclick="copyParentLink()">📋 คัดลอกลิงก์ส่ง LINE</button>
      </div>
    </div>

    <!-- ส่วนเนื้อหาบทเรียนและสนทนา -->
    <div id="contentSection" style="display: none;">
      
      <!-- แผนการสอน -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;">
          <div>
            <h3 style="font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
              <span>📚</span> แผนการสอนและบทเรียน
            </h3>
            <p id="courseSub" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">เรียนผ่านแล้ว 0 จาก 0 บท</p>
          </div>
          <button class="btn btn-primary" onclick="addTopicPrompt()">+ เพิ่มเนื้อหาบทเรียน</button>
        </div>
        
        <div id="topicList"></div>
      </div>

      <!-- กล่องข้อความและฟีดแบ็ก -->
      <div class="card">
        <h3 style="font-size: 1.1rem; margin-bottom: 12px;">💬 สนทนา / ฟีดแบ็กกับผู้ปกครอง (น้อง <span id="chatStName" style="color: var(--primary-dark);"></span>)</h3>
        <div id="tutorChatBox" class="chat-box"></div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="tutorMsgInput" class="select-st" placeholder="พิมพ์ข้อความตอบกลับผู้ปกครอง..." onkeypress="if(event.key==='Enter') sendTutorComment()">
          <button class="btn btn-primary" onclick="sendTutorComment()">ส่งข้อความ</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    let currentStudentId = null;
    let allStudents = [];

    async function loadStudents() {
      const res = await fetch('/api/students');
      const data = await res.json();
      if (data.success) {
        allStudents = data.data;
        const select = document.getElementById('studentSelect');
        if (allStudents.length === 0) {
          select.innerHTML = '<option value="">-- ยังไม่มีนักเรียนในระบบ --</option>';
          document.getElementById('contentSection').style.display = 'none';
          return;
        }
        select.innerHTML = '';
        allStudents.forEach(st => {
          select.innerHTML += `<option value="${st.id}">น้อง${st.nickname} - ${st.full_name} (${st.grade_level}) [วิชา: ${st.course_title || 'ทั่วไป'}]</option>`;
        });

        if (!currentStudentId || !allStudents.find(s => s.id === currentStudentId)) {
          currentStudentId = allStudents[0].id;
        }
        select.value = currentStudentId;
        onStudentChange(currentStudentId);
      }
    }

    async function onStudentChange(id) {
      if (!id) return;
      currentStudentId = id;
      document.getElementById('contentSection').style.display = 'block';
      const st = allStudents.find(s => s.id === id);
      document.getElementById('chatStName').innerText = st.nickname;
      loadProgress();
      loadTutorChat();
    }

    async function loadProgress() {
      const res = await fetch(`/api/students/${currentStudentId}/progress`);
      const data = await res.json();
      if (data.success) {
        const topics = data.topics || [];
        const completed = topics.filter(t => t.status === 'completed').length;
        document.getElementById('courseSub').innerText = `เรียนผ่านแล้ว ${completed} จาก ${topics.length} บท`;

        const list = document.getElementById('topicList');
        if (topics.length === 0) {
          list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; padding: 14px 0;">ยังไม่มีบทเรียน คลิกปุ่ม "+ เพิ่มเนื้อหาบทเรียน" เพื่อเริ่มต้น</p>';
          return;
        }

        list.innerHTML = topics.map(t => {
          let statusThai = t.status === 'completed' ? 'เรียนเสร็จแล้ว' : (t.status === 'in_progress' ? 'กำลังเรียนอยู่' : 'ยังไม่เริ่ม');
          let numClass = `num-${t.status || 'pending'}`;
          let tagClass = `tag-${t.status || 'pending'}`;

          let filesHtml = (t.attachments && t.attachments.length > 0) 
            ? '<div style="margin-top: 4px;">' + t.attachments.map(a => `<a href="${a.file_url}" target="_blank" class="attachment-capsule">📎 ${a.file_name}</a>`).join('') + '</div>'
            : '';
          let noteHtml = t.tutor_notes ? `<div style="font-size: 0.82rem; color: #475569; margin-top: 6px; background: #f8fafc; padding: 6px 10px; border-radius: 8px;">📝 <b>บันทึก:</b> ${t.tutor_notes}</div>` : '';

          return `
            <div class="topic-card-item">
              <div class="topic-left">
                <div class="badge-num ${numClass}">${t.sequence_order}</div>
                <div style="flex: 1;">
                  <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">
                    <b style="font-size: 1rem;">${t.title}</b>
                    <span class="status-tag ${tagClass}">${statusThai}</span>
                    <button class="action-link" onclick="editTopicName('${t.topic_id}', '${t.title}')">✏️ แก้ไข</button>
                    <button class="action-link delete" onclick="deleteTopic('${t.topic_id}')">🗑️ ลบ</button>
                  </div>
                  ${noteHtml}
                  ${filesHtml}
                </div>
              </div>
              <div>
                <button class="btn btn-outline" style="font-size: 0.82rem; white-space: nowrap;" onclick="updateProgressModal('${t.topic_id}')">✏️ อัปเดตผล / แนบไฟล์</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    async function addTopicPrompt() {
      const title = prompt('กรุณาระบุชื่อบทเรียน / หัวข้อใหม่:');
      if (!title) return;
      await fetch('/api/topics', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, studentId: currentStudentId })
      });
      loadProgress();
    }

    async function editTopicName(topicId, oldTitle) {
      const title = prompt('แก้ไขชื่อบทเรียน:', oldTitle);
      if (!title || title === oldTitle) return;
      await fetch(`/api/topics/${topicId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      loadProgress();
    }

    async function deleteTopic(topicId) {
      if (!confirm('ต้องการลบบทเรียนนี้ใช่หรือไม่?')) return;
      await fetch(`/api/topics/${topicId}`, { method: 'DELETE' });
      loadProgress();
    }

    async function updateProgressModal(topicId) {
      const status = prompt('ระบุสถานะ:\ncompleted = เรียนเสร็จแล้ว\nin_progress = กำลังเรียนอยู่\npending = ยังไม่เริ่ม', 'completed');
      if (!status) return;
      const tutorNotes = prompt('บันทึกความเข้าใจ / การบ้าน:');

      const fd = new FormData();
      fd.append('status', status);
      if (tutorNotes) fd.append('tutorNotes', tutorNotes);

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.multiple = true;
      fileInput.onchange = async () => {
        for (let i = 0; i < fileInput.files.length; i++) {
          fd.append('files', fileInput.files[i]);
        }
        await submitProgressUpdate(topicId, fd);
      };

      if (confirm('ต้องการแนบรูปภาพ/วิดีโอ/ไฟล์ หรือไม่? (กด OK เพื่อเลือกไฟล์ หรือกด Cancel เพื่อบันทึกทันที)')) {
        fileInput.click();
      } else {
        await submitProgressUpdate(topicId, fd);
      }
    }

    async function submitProgressUpdate(topicId, fd) {
      await fetch(`/api/progress/${currentStudentId}/${topicId}`, {
        method: 'PATCH',
        body: fd
      });
      loadProgress();
    }

    async function openAddStudent() {
      const nickname = prompt('ชื่อเล่น:');
      if (!nickname) return;
      const fullName = prompt('ชื่อ-นามสกุลจริง:');
      const gradeLevel = prompt('ระดับชั้น (เช่น ป.3, ม.1):');
      const courseTitle = prompt('ชื่อวิชาที่เรียน (เช่น คณิตศาสตร์พื้นฐาน):');
      
      const res = await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, fullName: fullName || nickname, gradeLevel: gradeLevel || 'ทั่วไป', courseTitle: courseTitle || 'วิชาเรียนทั่วไป' })
      });
      const data = await res.json();
      if (data.success) {
        currentStudentId = data.student.id;
        loadStudents();
      }
    }

    async function editCurrentStudent() {
      const st = allStudents.find(s => s.id === currentStudentId);
      if (!st) return;
      const nickname = prompt('แก้ไขชื่อเล่น:', st.nickname);
      const fullName = prompt('แก้ไขชื่อ-นามสกุล:', st.full_name);
      const gradeLevel = prompt('แก้ไขระดับชั้น:', st.grade_level);
      const courseTitle = prompt('แก้ไขชื่อวิชา:', st.course_title);

      await fetch(`/api/students/${currentStudentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, fullName, gradeLevel, courseTitle })
      });
      loadStudents();
    }

    async function deleteCurrentStudent() {
      if (!confirm('ยืนยันลบนักเรียนคนนี้พร้อมประวัติและบทเรียนทั้งหมดหรือไม่?')) return;
      await fetch(`/api/students/${currentStudentId}`, { method: 'DELETE' });
      currentStudentId = null;
      loadStudents();
    }

    function copyParentLink() {
      const link = `${window.location.origin}/parent.html`;
      navigator.clipboard.writeText(link);
      alert(`คัดลอกลิงก์รวมสำหรับส่งให้ผู้ปกครองเรียบร้อยแล้ว:\n${link}`);
    }

    async function loadTutorChat() {
      if (!currentStudentId) return;
      const res = await fetch(`/api/comments/${currentStudentId}`);
      const data = await res.json();
      const box = document.getElementById('tutorChatBox');
      if (data.success && data.comments.length > 0) {
        box.innerHTML = data.comments.map(c => `
          <div class="chat-msg ${c.sender_role}">
            <b>${c.sender_name}:</b> ${c.message}
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      } else {
        box.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center;">ยังไม่มีข้อความสนทนา</p>';
      }
    }

    async function sendTutorComment() {
      const input = document.getElementById('tutorMsgInput');
      const msg = input.value.trim();
      if (!msg || !currentStudentId) return;

      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: currentStudentId,
          senderRole: 'tutor',
          senderName: 'คุณครู',
          message: msg
        })
      });
      input.value = '';
      loadTutorChat();
    }

    setInterval(() => { if (currentStudentId) loadTutorChat(); }, 8000);
    loadStudents();
  </script>
</body>
</html>
